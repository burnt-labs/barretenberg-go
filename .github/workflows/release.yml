name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wrapper/**"
      - "include/**"
      - "barretenberg/**"
      - "checksums.json"
      - "scripts/**"
      - "Makefile"

permissions:
  contents: read

# Releases from one ref run one at a time, so two quick merges cannot both
# compute the same next version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux_amd64
            runner: ubicloud-standard-4
            aztec_arch: amd64
            aztec_os: linux
          - platform: linux_amd64_musl
            runner: ubicloud-standard-4
            aztec_arch: amd64
            aztec_os: linux
            musl: true
            cross_compile: true
          - platform: linux_arm64
            runner: ubicloud-standard-4-arm
            aztec_arch: arm64
            aztec_os: linux
          - platform: linux_arm64_musl
            runner: ubicloud-standard-4-arm
            aztec_arch: arm64
            aztec_os: linux
            musl: true
            cross_compile: true
          - platform: darwin_amd64
            runner: macos-15
            aztec_arch: amd64
            aztec_os: darwin
            cross_compile: true
          - platform: darwin_arm64
            runner: macos-latest
            aztec_arch: arm64
            aztec_os: darwin
            cross_compile: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install libc++ (Linux)
        if: startsWith(matrix.platform, 'linux_') && matrix.musl != true
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Install pinned Zig toolchain
        if: matrix.musl == true
        run: |
          ./scripts/install-zig.sh "${RUNNER_TEMP}/zig-0.14.1" >> "$GITHUB_PATH"

      - name: Build wrapper
        env:
          CC: ${{ matrix.musl && 'zig-cc' || '' }}
          CXX: ${{ matrix.musl && 'zig-c++' || '' }}
          AR: ${{ matrix.musl && 'zig-ar' || '' }}
        run: ./scripts/build-wrapper.sh --platform ${{ matrix.platform }}

      - name: Run tests
        if: matrix.cross_compile != true
        run: go test -v -count=1 ./...

      - name: Verify static musl link
        if: matrix.musl == true
        run: ./scripts/verify-static-link.sh ${{ matrix.aztec_arch }} "${RUNNER_TEMP}/barretenberg.test"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.platform }}
          path: lib/${{ matrix.platform }}/libbarretenberg.a

  consumer-link:
    needs: build
    uses: ./.github/workflows/consumer-link.yml

  # The release assets are the distribution channel: consumers (xion's
  # scripts/download-barretenberg.sh) fetch libbarretenberg_<platform>.a from
  # the release and check it against checksums they commit themselves. The Go
  # module zip only carries the lib/ LFS pointers, so nothing is committed back
  # to main here; main only changes through pull requests.
  release:
    needs: [build, consumer-link]
    runs-on: ubicloud-standard-2
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for platform in linux_amd64 linux_amd64_musl linux_arm64 linux_arm64_musl darwin_amd64 darwin_arm64; do
            cp "artifacts/lib-${platform}/libbarretenberg.a" \
               "release-assets/libbarretenberg_${platform}.a"
          done
          ls -lh release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.a > checksums.txt
          cat checksums.txt

      # Only main publishes. A workflow_dispatch on another branch runs the
      # full build, link test and asset preparation as a dry run.
      - name: Determine next version
        id: semver
        if: github.ref == 'refs/heads/main'
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true
          dry: true

      - name: Create release with assets
        if: steps.semver.outputs.version != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.semver.outputs.version }}
        run: |
          # Draft first so the tag and release only appear once every asset is
          # uploaded, and tag the commit that was built, not whatever main
          # points at by the time the upload finishes.
          gh release create "$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            release-assets/*
          gh release edit "$VERSION" --draft=false --latest

          echo "Released $VERSION at $GITHUB_SHA with assets:"
          ls release-assets/

      - name: Report dry run
        if: github.ref != 'refs/heads/main'
        run: echo "Dry run on $GITHUB_REF at $GITHUB_SHA; assets prepared, nothing published."
