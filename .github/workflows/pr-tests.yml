name: PR Tests

on:
  pull_request:
    branches: [main]
    paths: ['barretenberg/**', 'wrapper/**', 'include/**', 'checksums.json', 'scripts/**', 'Makefile']

jobs:
  test:
    strategy:
      matrix:
        include:
          - platform: linux_amd64
            runner: ubicloud-standard-4
            aztec_arch: amd64
            aztec_os: linux
          - platform: linux_arm64
            runner: ubicloud-standard-4-arm
            aztec_arch: arm64
            aztec_os: linux
          - platform: linux_arm64_musl
            runner: ubicloud-standard-4-arm
            aztec_arch: arm64
            aztec_os: linux
            musl: true

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install libc++ (Linux)
        if: startsWith(matrix.platform, 'linux_') && matrix.musl != true
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Install pinned Zig toolchain
        if: matrix.musl == true
        run: |
          ./scripts/install-zig.sh "${RUNNER_TEMP}/zig-0.14.1" >> "$GITHUB_PATH"

      - name: Build wrapper
        env:
          CC: ${{ matrix.musl && 'zig-cc' || '' }}
          CXX: ${{ matrix.musl && 'zig-c++' || '' }}
          AR: ${{ matrix.musl && 'zig-ar' || '' }}
        run: ./scripts/build-wrapper.sh --platform ${{ matrix.platform }}

      - name: Run tests
        if: matrix.musl != true
        run: go test -v -count=1 ./...

      - name: Verify musl archive
        if: matrix.musl == true
        run: |
          ar t lib/linux_arm64_musl/libbarretenberg.a >/dev/null
          test "$(ar t lib/linux_arm64_musl/libbarretenberg.a | grep -cx barretenberg_wrapper.o)" -eq 1
          test "$(ar t lib/linux_arm64_musl/libbarretenberg.a | grep -cx musl_compat.o)" -eq 1

          GOOS=linux GOARCH=arm64 CGO_ENABLED=1 \
            CC=aarch64-linux-musl-zig-cc \
            CXX=aarch64-linux-musl-zig-c++ \
            go test -c -tags muslc \
            -ldflags "-linkmode=external -extldflags '-static'" \
            -o "${RUNNER_TEMP}/barretenberg.test" ./barretenberg

          file "${RUNNER_TEMP}/barretenberg.test" | grep -q 'statically linked'
          if readelf -l "${RUNNER_TEMP}/barretenberg.test" | grep -q INTERP; then
            echo "musl test binary unexpectedly has an ELF interpreter"
            exit 1
          fi
          if readelf -d "${RUNNER_TEMP}/barretenberg.test" 2>&1 | grep -q NEEDED; then
            echo "musl test binary unexpectedly has dynamic dependencies"
            exit 1
          fi

          "${RUNNER_TEMP}/barretenberg.test" -test.v
