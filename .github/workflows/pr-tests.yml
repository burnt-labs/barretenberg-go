name: PR Tests

on:
  pull_request:
    branches: [main]
    paths: ['barretenberg/**', 'wrapper/**', 'include/**', 'checksums.json', 'scripts/**', 'Makefile', '.github/workflows/**']

jobs:
  test:
    strategy:
      matrix:
        include:
          - platform: linux_amd64
            runner: ubicloud-standard-4
            aztec_arch: amd64
            aztec_os: linux
          - platform: linux_amd64_musl
            runner: ubicloud-standard-4
            aztec_arch: amd64
            aztec_os: linux
            musl: true
          - platform: linux_arm64
            runner: ubicloud-standard-4-arm
            aztec_arch: arm64
            aztec_os: linux
          - platform: linux_arm64_musl
            runner: ubicloud-standard-4-arm
            aztec_arch: arm64
            aztec_os: linux
            musl: true

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install libc++ (Linux)
        if: startsWith(matrix.platform, 'linux_') && matrix.musl != true
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Install pinned Zig toolchain
        if: matrix.musl == true
        run: |
          ./scripts/install-zig.sh "${RUNNER_TEMP}/zig-0.14.1" >> "$GITHUB_PATH"

      - name: Build wrapper
        env:
          CC: ${{ matrix.musl && 'zig-cc' || '' }}
          CXX: ${{ matrix.musl && 'zig-c++' || '' }}
          AR: ${{ matrix.musl && 'zig-ar' || '' }}
        run: ./scripts/build-wrapper.sh --platform ${{ matrix.platform }}

      - name: Run tests
        if: matrix.musl != true
        run: go test -v -count=1 ./...

      - name: Verify musl archive
        if: matrix.musl == true
        run: |
          lib="lib/${{ matrix.platform }}/libbarretenberg.a"
          ar t "$lib" >/dev/null
          test "$(ar t "$lib" | grep -cx barretenberg_wrapper.o)" -eq 1
          test "$(ar t "$lib" | grep -cx musl_compat.o)" -eq 1
          ./scripts/verify-static-link.sh ${{ matrix.aztec_arch }} "${RUNNER_TEMP}/barretenberg.test"

      - name: Upload musl archive
        if: matrix.musl == true
        uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.platform }}
          path: lib/${{ matrix.platform }}/libbarretenberg.a

  consumer-link:
    needs: test
    uses: ./.github/workflows/consumer-link.yml
